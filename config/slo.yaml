service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >
    Baseline của lab: P95 latency ~570 ms, P99 ~1250 ms, error rate 0%,
    retrieval success 100%, quality score trung bình ~0.85. Tất cả đều nằm trong ngưỡng.
    SLO 99.5% nghĩa là cửa sổ 28 ngày cho phép tối đa 0.5% request không đạt.
    Với khối lượng ~200 request trong buổi lab, error budget tương đương 1 request.
    Nếu vượt quá 1 request chậm >3000 ms hoặc lỗi trong 28 ngày thì cần can thiệp.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
